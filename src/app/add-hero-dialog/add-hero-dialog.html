<h2 mat-dialog-title>Add Hero</h2>
<form (ngSubmit)="onSubmit()" [formGroup]="heroForm">
<mat-dialog-content>
    <p>Enter the hero's details:</p>
        <mat-form-field appearance="outline">
            <input matInput placeholder="Hero Name" formControlName="name" class="input-upper" />
        </mat-form-field>
        @if (errorMessage())
        {
            <mat-error>
                {{errorMessage()}}
            </mat-error>
        }
    </mat-dialog-content>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton cdkFocusInitial type="submit" [disabled]="isWorking() || heroForm.invalid">
            @if (isWorking())
            {
                <mat-spinner diameter="20"></mat-spinner>
            }
            @else
            {
                Add
            }
        </button>
    </mat-dialog-actions>
</form>
